<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="12" fill="#2b2b2b"/>

  <!-- Signal path line connecting fader bases -->
  <line x1="12" y1="52" x2="52" y2="52" stroke="#4fc3f7" stroke-width="1.5"
        stroke-linecap="round" opacity="0.4"/>

  <!-- Fader 1 (left) — track + cap at 60% -->
  <rect x="13" y="12" width="4" height="40" rx="2" fill="#555555"/>
  <rect x="11" y="31" width="8" height="6" rx="2" fill="#ffffff"/>

  <!-- Fader 2 (centre) — track + cap at 35% -->
  <rect x="30" y="12" width="4" height="40" rx="2" fill="#555555"/>
  <rect x="28" y="22" width="8" height="6" rx="2" fill="#4fc3f7"/>

  <!-- Fader 3 (right) — track + cap at 75% -->
  <rect x="47" y="12" width="4" height="40" rx="2" fill="#555555"/>
  <rect x="45" y="38" width="8" height="6" rx="2" fill="#ffffff"/>

</svg>
